# Pack and publish the dsh release sequence: every package under packages/ plus
# the published CLI and Web apps, all on one version. The private desktop app
# stays outside npm; vendored and native packages use their own release lines.
#
# Pack runs without credentials on every pull request and master push, so a
# pull request proves the whole publish set still packs. Publication is a
# manual dispatch from a dsh-v* tag and consumes exactly the packed bytes.
name: Release (dsh)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packed tarballs to npm. Must run from a dsh-v* tag.
        required: true
        type: boolean
        default: false
      desktop_sign:
        description: Sign the desktop application and Squirrel installer for release acceptance.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Pack runs per ref so concurrent pull requests never displace each
  # other; the publish job below serializes the shared dist-tag state.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: pnpm run release:verify --family dsh

      - name: Build
        run: pnpm run build

      - name: Pack release tarballs
        run: pnpm run release:pack --family dsh --out dist/npm

      # The harness packages declare the vendored framework as a peer, and this
      # verification must not depend on the registry already carrying matching
      # versions — one pull request may bump both families before either
      # publishes — so it installs that family's pack output too. Only dist/npm
      # is published.
      - name: Pack the vendored framework for verification
        run: pnpm run release:pack --family vendor --out dist/npm-vendor

      # dsh-sandbox-local declares the Landlock entry as a runtime dependency, so
      # the verification needs its tarball. Its platform packages stay out: they
      # are optional, and building them needs a musl toolchain per architecture.
      - name: Pack the Landlock entry for verification
        run: |
          pnpm --dir native/landlock-run run build:ts
          pnpm --dir native/landlock-run/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"
          pnpm run release:normalize-tarball -- dist/npm-landlock/*.tgz

      - name: Verify packed install
        run: pnpm run release:verify-packed-install --family dsh --from dist/npm --from dist/npm-vendor --from dist/npm-landlock --web --report dist/packed-web-proof.json

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-packed-runtime-proof-inputs
          path: |
            dist/npm/*
            dist/npm-vendor/*
            dist/npm-landlock/*
            dist/packed-web-proof.json
          if-no-files-found: error
          retention-days: 7

  packed-web-windows:
    name: Prove packed Web runtime (Windows x64)
    needs: pack
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install release-script dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: dsh-packed-runtime-proof-inputs
          path: dist

      - name: Prove packed Web runtime
        run: pnpm run desktop:prove-runtime --from dist/npm --from dist/npm-vendor --from dist/npm-landlock --report dist/packed-web-proof-windows-x64.json

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-packed-web-proof-windows-x64
          path: dist/packed-web-proof-windows-x64.json
          if-no-files-found: error
          retention-days: 7

  stage-runtime-windows:
    name: Stage desktop runtime (Windows x64)
    needs: [pack, packed-web-windows]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install staging dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: dsh-packed-runtime-proof-inputs
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: dsh-packed-web-proof-windows-x64
          path: dist

      - name: Stage Windows runtime
        run: pnpm run desktop:stage-runtime --from dist/npm --from dist/npm-vendor --from dist/npm-landlock --proof dist/packed-web-proof-windows-x64.json --out dist/desktop-runtime/windows-x64 --download-node

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-runtime-windows-x64
          path: dist/desktop-runtime/windows-x64/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  verify-staged-runtime-windows:
    name: Verify staged runtime without checkout
    needs: stage-runtime-windows
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-runtime-windows-x64
          path: staged

      - name: Start staged Web runtime
        run: .\staged\runtime\node\node.exe .\staged\verification\verify-staged-runtime.mjs .\staged\runtime .\staged\verification\expected-packed-web-proof.json .\staged\verification\checkout-free-proof.json

  verify-desktop-shell-windows:
    name: Verify Electron shell (Windows x64)
    needs: stage-runtime-windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-runtime-windows-x64
          path: dist/desktop-runtime/windows-x64

      - name: Build and unit test desktop shell
        run: |
          pnpm run desktop:build
          pnpm run desktop:test

      - name: Exercise staged Web runtime in Electron
        run: pnpm run desktop:test:electron "${{ github.workspace }}\dist\desktop-runtime\windows-x64\runtime"

      - name: Make and inspect desktop installer
        run: |
          if ('${{ inputs.desktop_sign }}' -eq 'true') {
            if (-not $env:DSH_WINDOWS_CERTIFICATE_PFX_BASE64) { throw 'signed desktop build requires DSH_WINDOWS_CERTIFICATE_PFX_BASE64' }
            $certificate = Join-Path $env:RUNNER_TEMP 'desktop-signing.pfx'
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:DSH_WINDOWS_CERTIFICATE_PFX_BASE64))
            "DSH_WINDOWS_CERTIFICATE_FILE=$certificate" >> $env:GITHUB_ENV
            $env:DSH_WINDOWS_CERTIFICATE_FILE = $certificate
          }
          pnpm run desktop:make
          pnpm run desktop:verify-package
          pnpm run desktop:verify-installer
        shell: pwsh
        env:
          DSH_WINDOWS_CERTIFICATE_PFX_BASE64: ${{ inputs.desktop_sign && secrets.DSH_WINDOWS_CERTIFICATE_PFX_BASE64 || '' }}
          DSH_WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.desktop_sign && secrets.DSH_WINDOWS_CERTIFICATE_PASSWORD || '' }}
          DSH_WINDOWS_SIGN_REQUIRED: ${{ inputs.desktop_sign && '1' || '0' }}

      - name: Exercise packaged application from spaces and non-ASCII
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP '桌面 客户端'
          Copy-Item -Recurse -LiteralPath 'apps/desktop/out/DeepSeek Harness-win32-x64' -Destination $target
          pnpm run desktop:test:packaged (Join-Path $target 'DeepSeek Harness.exe')

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-installer-windows-x64-${{ inputs.desktop_sign && 'signed' || 'unsigned' }}
          path: |
            apps/desktop/out/make/**/DeepSeek-Harness-Setup-x64.exe
            apps/desktop/out/make/**/*-full.nupkg
            apps/desktop/out/make/**/RELEASES
            apps/desktop/out/make/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always() && inputs.desktop_sign
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'desktop-signing.pfx') -Force -ErrorAction SilentlyContinue

  publish:
    name: Publish to npm
    if: inputs.publish
    needs: [pack, packed-web-windows, verify-staged-runtime-windows, verify-desktop-shell-windows]
    runs-on: ubuntu-24.04
    # Required reviewers and the allowed tags live on the environment; this is
    # the only step in the sequence that can write to the registry.
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Checkout and install carry the release scripts only. There is no build
      # step: publication uploads the bytes the pack job produced.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install (immutable, no package scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: dsh-npm-tarballs
          path: dist/npm

      - name: Publish tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:publish --family dsh --from dist/npm
